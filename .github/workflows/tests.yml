name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Start Docker services
      run: docker compose up -d

    - name: Wait for services to be ready
      run: sleep 5

    - name: Run tests on PHP 7.4
      run: docker compose run phpcli php ./vendor/bin/phpunit --coverage-text

    - name: Run tests on PHP 8.3
      run: docker compose run phpcli-latest ./vendor/bin/phpunit --coverage-text

    - name: Stop Docker services
      run: docker compose down
      if: always()
